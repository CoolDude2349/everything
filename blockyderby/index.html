<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <base href="https://cdn.jsdelivr.net/gh/cooldude2349/everything@main/blockyderby/">
    <title>Unity WebGL Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      html, body, #unity-container {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #231F20;
        overflow: hidden;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas"></canvas>
    </div>

    <script>
      const buildJson = "Build/e3af4070d5d7b18590be17868c7d2df8-edit.json";
      const loaderUrl = "Build/UnityLoader-v3.js";

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        UnityLoader.instantiate("unity-canvas", buildJson);
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
